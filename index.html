<!DOCTYPE html>
<html lang="th">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta charset="UTF-8">
  <title>ผู้พิทักษ์จิ๋ว - AR เกมป้องกันสิ่งเสพติด</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>
  <style>
    body { margin: 0; overflow: hidden; font-family: 'Tahoma', sans-serif; }
    #ui-container { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); z-index: 999; background: rgba(0, 0, 0, 0.7); color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 18px; text-align: center; min-width: 220px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    #instructions { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 999; color: #fff; background: #28a745; padding: 10px 20px; border-radius: 25px; font-size: 16px; font-weight: bold; text-align: center; pointer-events: none; }
  </style>
</head>
<body>
  <div id="ui-container"><span>🏆 คะแนน: <b id="score-text">0</b></span> | <span>พลัง: <span id="lives-text">❤️❤️❤️</span></span></div>
  <div id="instructions">👈 เอียงคอ ซ้าย-ขวา เพื่อรับนมสด / หลบควันบุหรี่ 👉</div>
  <a-scene mindar-face embedded color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    <a-camera active="false" position="0 0 0"></a-camera>
    <a-entity id="face-target" mindar-face-target="anchorIndex: 1">
      <a-sphere id="player-shield" position="0 -0.25 -0.1" radius="0.06" color="#00d2ff" opacity="0.8">
        <a-ring color="#ffffff" radius-inner="0.06" radius-outer="0.08"></a-ring>
      </a-sphere>
    </a-entity>
    <a-entity id="items-container"></a-entity>
  </a-scene>
  <script>
    let score = 0, lives = 3, gameActive = true;
    const faceTarget = document.getElementById('face-target'), playerShield = document.getElementById('player-shield'), itemsContainer = document.getElementById('items-container'), scoreText = document.getElementById('score-text'), livesText = document.getElementById('lives-text');
    let shieldPosX = 0;
    function updateHeadTilt() {
      if (!gameActive) return;
      const tiltZ = faceTarget.object3D.rotation.z;
      if (tiltZ > 0.12) shieldPosX = -0.3;
      else if (tiltZ < -0.12) shieldPosX = 0.3;
      else shieldPosX = 0;
      playerShield.setAttribute('position', `${shieldPosX} -0.25 -0.1`);
      requestAnimationFrame(updateHeadTilt);
    }
    document.querySelector('a-scene').addEventListener('renderstart', () => { updateHeadTilt(); setInterval(spawnItem, 2000); });
    function spawnItem() {
      if (!gameActive) return;
      const item = document.createElement('a-entity');
      const isGood = Math.random() > 0.4;
      const positionsX = [-0.3, 0, 0.3];
      const startX = positionsX[Math.floor(Math.random() * positionsX.length)];
      let startY = 0.6, posZ = -0.6;
      item.setAttribute('position', `${startX} ${startY} ${posZ}`);
      if (isGood) { item.setAttribute('geometry', 'primitive: sphere; radius: 0.05'); item.setAttribute('material', 'color: #28a745'); item.dataset.type = 'good'; }
      else { item.setAttribute('geometry', 'primitive: box; width: 0.08; height: 0.08; depth: 0.08'); item.setAttribute('material', 'color: #343a40'); item.dataset.type = 'bad'; }
      itemsContainer.appendChild(item);
      const dropInterval = setInterval(() => {
        if (!gameActive) { clearInterval(dropInterval); item.remove(); return; }
        startY -= 0.015;
        item.setAttribute('position', `${startX} ${startY} ${posZ}`);
        if (startY <= -0.2 && startY >= -0.3 && Math.abs(startX - shieldPosX) < 0.1) { handleCollision(item.dataset.type); clearInterval(dropInterval); item.remove(); }
        if (startY < -0.5) { clearInterval(dropInterval); item.remove(); }
      }, 30);
    }
    function handleCollision(type) {
      if (type === 'good') { score += 10; scoreText.innerText = score; }
      else { lives -= 1; updateLivesUI(); if (lives <= 0) gameOver(); }
    }
    function updateLivesUI() {
      let hearts = ''; for (let i = 0; i < lives; i++) hearts += '❤️';
      livesText.innerText = hearts || '💀';
    }
    function gameOver() { gameActive = false; alert(`จบเกม! คุณได้คะแนน: ${score} คะแนน\nคุณคือผู้พิทักษ์จิ๋วที่เก่งมาก!`); location.reload(); }
  </script>
</body>
</html>
