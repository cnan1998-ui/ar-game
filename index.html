<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ผู้พิทักษ์จิ๋ว - AR เกมป้องกันสิ่งเสพติด</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Tahoma,Arial,sans-serif}
#ui{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:9999;background:rgba(0,0,0,.78);color:#fff;padding:11px 20px;border-radius:24px;font-size:18px;font-weight:bold;white-space:nowrap}
#msg{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:9999;width:calc(100% - 36px);max-width:480px;padding:12px 18px;border-radius:26px;background:#28a745;color:#fff;text-align:center;font-size:16px;font-weight:bold;pointer-events:none}
#start{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.78);color:#fff;text-align:center}
#box{width:100%;max-width:400px;padding:28px 22px;border-radius:24px;background:rgba(25,25,25,.96)}
#box h1{margin:0 0 12px;font-size:28px}
#box p{line-height:1.7;color:#eee}
button{width:100%;padding:15px;border:0;border-radius:30px;background:#28a745;color:#fff;font-size:20px;font-weight:bold}
#debug{position:fixed;top:68px;left:8px;z-index:9998;color:#fff;background:rgba(0,0,0,.45);padding:3px 7px;border-radius:8px;font-size:10px}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="start"><div id="box">
<h1>🛡️ ผู้พิทักษ์จิ๋ว</h1>
<p>🥛🍎🥦💧 ของมีประโยชน์ <b>+10 คะแนน</b><br>
🚬💊🍺 สิ่งเสพติด <b>-10 คะแนน</b><br><br>
เอียงศีรษะซ้าย-ขวาเพื่อควบคุมโล่</p>
<button id="startBtn">🎮 เริ่มเกม</button>
</div></div>
<div id="ui">🏆 คะแนน: <span id="score">0</span> &nbsp;|&nbsp; พลัง: <span id="lives">❤️❤️❤️</span></div>
<div id="msg">👆 กด “เริ่มเกม”</div>
<div id="debug">พร้อม</div>

<a-scene id="scene" mindar-face embedded color-space="sRGB"
 renderer="colorManagement:true;antialias:true"
 vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false"
 loading-screen="enabled:false">
<a-camera active="false" position="0 0 0"></a-camera>
<a-entity id="face" mindar-face-target="anchorIndex:1">
<a-ring id="shield" position="0 -0.25 -0.08" radius-inner=".075" radius-outer=".105"
 material="color:#00d9ff;shader:flat;opacity:1"></a-ring>
<a-circle position="0 -0.25 -0.08" radius=".055"
 material="color:#fff;shader:flat;opacity:.9"></a-circle>
</a-entity>
<a-entity id="items" position="0 0 -0.9"></a-entity>
</a-scene>

<script>
const scene=document.getElementById('scene');
const face=document.getElementById('face');
const shield=document.getElementById('shield');
const items=document.getElementById('items');
const scoreEl=document.getElementById('score');
const livesEl=document.getElementById('lives');
const msg=document.getElementById('msg');
const debug=document.getElementById('debug');
const start=document.getElementById('start');
const startBtn=document.getElementById('startBtn');

let score=0,lives=3,active=false,found=false,shieldX=0,spawnTimer=null;

const good=[
  ['milk.svg','นม'],['fruit.svg','ผลไม้'],['vegetable.svg','ผัก'],['water.svg','น้ำ']
];
const bad=[
  ['cigarette.svg','บุหรี่'],['drugs.svg','ยาเสพติด'],['alcohol.svg','แอลกอฮอล์']
];

function say(t){debug.textContent=t;console.log(t)}
function asset(file){return './'+file}

startBtn.onclick=()=>{
  start.classList.add('hidden');
  active=true;
  msg.textContent='🔍 กำลังค้นหาใบหน้า...';
  say('เกมเริ่มแล้ว');
  try{const s=scene.systems['mindar-face']; if(s)s.start()}catch(e){say('AR start error')}
  spawn();
  spawnTimer=setInterval(spawn,1300);
};

face.addEventListener('targetFound',()=>{
  found=true;
  msg.textContent='👈 เอียงคอซ้าย-ขวา เพื่อรับของดี / หลบสิ่งเสพติด 👉';
  msg.style.background='#28a745';
  say('พบใบหน้า');
});
face.addEventListener('targetLost',()=>{
  found=false;
  msg.textContent='🔍 กรุณาหันหน้าเข้ากล้อง';
  msg.style.background='#dc3545';
});

function head(){
  if(active&&found&&face.object3D){
    const z=face.object3D.rotation.z;
    shieldX=z>.08?-.38:z<-.08?.38:0;
    shield.setAttribute('position',`${shieldX} -0.25 -0.08`);
  }
  requestAnimationFrame(head);
}
head();

function spawn(){
  if(!active)return;
  const isGood=Math.random()<.6;
  const list=isGood?good:bad;
  const data=list[Math.floor(Math.random()*list.length)];
  const xs=[-.38,0,.38];
  const x=xs[Math.floor(Math.random()*xs.length)];
  let y=.75;

  const el=document.createElement('a-image');
  el.dataset.type=isGood?'good':'bad';
  el.dataset.name=data[1];
  el.setAttribute('src',asset(data[0]));
  el.setAttribute('width','.30');
  el.setAttribute('height','.30');
  el.setAttribute('position',`${x} ${y} 0`);
  el.setAttribute('material','shader:flat;transparent:true;side:double;opacity:1');
  items.appendChild(el);
  say((isGood?'🟢 ':'🔴 ')+data[1]+' กำลังตก');

  const timer=setInterval(()=>{
    if(!active){clearInterval(timer);el.remove();return}
    y-=.013;
    el.setAttribute('position',`${x} ${y} 0`);
    if(el.object3D)el.object3D.rotation.z+=.02;

    if(y<=-.14&&y>=-.39&&Math.abs(x-shieldX)<.20){
      collide(el.dataset.type,el.dataset.name);
      clearInterval(timer);el.remove();return;
    }
    if(y<-.9){clearInterval(timer);el.remove()}
  },30);
}

function collide(type,name){
  if(type==='good'){
    score+=10;
    scoreEl.textContent=score;
    msg.textContent='🎉 '+name+' +10 คะแนน';
    msg.style.background='#28a745';
  }else{
    score=Math.max(0,score-10);
    scoreEl.textContent=score;
    msg.textContent='🚫 '+name+' -10 คะแนน';
    msg.style.background='#dc3545';
  }
}
function updateLives(){
  livesEl.textContent='❤️'.repeat(Math.max(0,lives))||'💀';
}
scene.addEventListener('loaded',()=>say('ระบบ AR พร้อมใช้งาน'));
</script>
</body>
</html>
