<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ผู้พิทักษ์จิ๋ว - AR เกมป้องกันสิ่งเสพติด</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,Tahoma,sans-serif}
#camera{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);z-index:0}
#game{position:fixed;inset:0;width:100%;height:100%;z-index:5;pointer-events:none}
#ui{position:fixed;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:20;color:#fff;background:rgba(0,0,0,.72);padding:10px 18px;border-radius:25px;font-size:18px;font-weight:700;white-space:nowrap}
#tip{position:fixed;top:78px;left:50%;transform:translateX(-50%);z-index:20;color:#fff;background:rgba(0,0,0,.58);padding:8px 14px;border-radius:20px;font-size:14px;text-align:center;white-space:nowrap}
#status{position:fixed;bottom:max(24px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:20;width:calc(100% - 36px);max-width:650px;padding:15px 18px;border-radius:32px;text-align:center;color:#fff;background:#dc3545;font-size:18px;font-weight:700}
#start{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:22px}
#card{width:100%;max-width:430px;background:#202020;color:#fff;border-radius:26px;padding:28px;text-align:center}
#card h1{margin:0 0 10px;font-size:29px}#card p{line-height:1.75}
button{width:100%;border:0;border-radius:32px;padding:17px;background:#20b24b;color:#fff;font-size:20px;font-weight:700}
</style>
</head>
<body>
<video id="camera" autoplay muted playsinline></video><canvas id="game"></canvas>
<div id="ui">🏆 คะแนน: <span id="score">0</span> &nbsp;|&nbsp; พลัง: <span id="lives">❤️❤️❤️</span></div>
<div id="tip">กดเริ่มเกมเพื่อเปิดกล้อง</div><div id="status">🔴 ยังไม่พบใบหน้า</div>
<div id="start"><div id="card"><h1>🛡️ ผู้พิทักษ์จิ๋ว</h1>
<p>🥛🍎🥦💧 ของมีประโยชน์ <b>+10</b><br>🚬💊🍺 สิ่งเสพติด <b>-10</b><br><br>เอียง/เลื่อนศีรษะซ้าย–ขวาเพื่อควบคุมโล่</p>
<button id="startBtn">🎮 เริ่มเกมและเปิดกล้อง</button></div></div>

<script type="module">
import {FilesetResolver,FaceDetector} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304/vision_bundle.mjs";

const video=document.getElementById("camera"),canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
const start=document.getElementById("start"),btn=document.getElementById("startBtn"),status=document.getElementById("status"),tip=document.getElementById("tip");
const scoreEl=document.getElementById("score");
let detector=null,faceFound=false,running=false,lastVideoTime=-1,shieldX=0,targetShieldX=0,score=0,items=[],last=performance.now(),nextSpawn=0,lastDetect=0;
const DETECT_INTERVAL=80; // ลดภาระ CPU เพื่อให้เกมลื่น


const good=[["milk.png","🥛"],["fruit.png","🍎"],["vegetable.png","🥦"],["water.png","💧"]];
const bad=[["cigarette.png","🚬"],["drugs.png","💊"],["alcohol.png","🍺"]];
const images={};[...good,...bad].forEach(([f])=>{let i=new Image();i.src=f;images[f]=i});

function resize(){let d=Math.min(devicePixelRatio||1,2);canvas.width=innerWidth*d;canvas.height=innerHeight*d;canvas.style.width=innerWidth+"px";canvas.style.height=innerHeight+"px";ctx.setTransform(d,0,0,d,0,0)}addEventListener("resize",resize);resize();
function setStatus(t,ok){status.textContent=t;status.style.background=ok?"#18a94b":"#dc3545"}

async function setupDetector(){
 try{
  tip.textContent="กำลังโหลดระบบตรวจใบหน้า...";
  const vision=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304/wasm");
  detector=await FaceDetector.createFromOptions(vision,{
   baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite"},
   runningMode:"VIDEO",minDetectionConfidence:.30,minSuppressionThreshold:.30
  });
  tip.textContent="กล้องเปิดแล้ว — กำลังตรวจจับใบหน้า...";
  detectLoop();
 }catch(e){console.error(e);setStatus("❌ โหลดระบบตรวจใบหน้าไม่สำเร็จ",false);tip.textContent="รีเฟรชหน้าเว็บแล้วลองใหม่"}
}
async function detectLoop(){
 if(!detector||video.readyState<2){requestAnimationFrame(detectLoop);return}
 const now=performance.now();
 // ตรวจหน้าเป็นช่วง ๆ แทนการตรวจทุกเฟรม ทำให้การวาดเกมไม่กระตุก
 if(now-lastDetect>=DETECT_INTERVAL && video.currentTime!==lastVideoTime){
  lastDetect=now;
  lastVideoTime=video.currentTime;
  try{
   const r=detector.detectForVideo(video,now),ds=r.detections||[];
   if(ds.length){
    faceFound=true;running=true;
    const b=ds[0].boundingBox;
    const cx=(b.originX+b.width/2)/video.videoWidth;
    // ใช้ตำแหน่งหน้าจริงต่อเนื่อง ไม่บังคับแค่ 3 ช่อง
    targetShieldX=Math.max(-170,Math.min(170,(0.5-cx)*520));
    setStatus("🟢 พบใบหน้า! เริ่มเกมแล้ว",true);
    tip.textContent="👈 เลื่อนหน้า ซ้าย–ขวา รับของดี / หลบสิ่งเสพติด 👉";
   }else{
    faceFound=false;running=false;targetShieldX=0;
    setStatus("🔴 ยังไม่พบใบหน้า — ขยับหน้าเข้ากลางภาพ",false);
    tip.textContent="ให้เห็นหน้าผากถึงคาง และมีแสงเพียงพอ";
   }
  }catch(e){console.warn(e)}
 }
 requestAnimationFrame(detectLoop);
}
async function startCamera(){
 try{
  const stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:"user",width:{ideal:1280},height:{ideal:720}}});
  video.srcObject=stream;await video.play();await setupDetector();
 }catch(e){setStatus("❌ เปิดกล้องไม่ได้ — อนุญาตกล้องใน Safari",false)}
}
btn.onclick=async()=>{start.style.display="none";await startCamera()};

function spawn(){let ok=Math.random()<.58,list=ok?good:bad,d=list[Math.floor(Math.random()*list.length)],lane=[.25,.5,.75][Math.floor(Math.random()*3)];items.push({x:innerWidth*lane,y:-70,speed:175+Math.random()*75,good:ok,file:d[0],emoji:d[1],hit:false})}
function hit(it){let sy=innerHeight-155;if(it.hit)return;if(it.y>sy-75&&it.y<sy+75&&Math.abs(it.x-(innerWidth/2+shieldX))<125){it.hit=true;score+=it.good?10:-10;scoreEl.textContent=score;setStatus(it.emoji+(it.good?" ของมีประโยชน์ +10 คะแนน":" สิ่งเสพติด -10 คะแนน"),it.good)}}
function draw(){
 let now=performance.now(),dt=Math.min(.04,(now-last)/1000||.016);last=now;
 ctx.clearRect(0,0,innerWidth,innerHeight);

 // ทำให้โล่ตามหน้าแบบนุ่มและเร็ว ไม่กระตุกเป็นซ้าย/กลาง/ขวา
 const follow=1-Math.pow(0.0005,dt);
 shieldX += (targetShieldX-shieldX)*follow;

 if(running&&faceFound&&now>=nextSpawn){spawn();nextSpawn=now+1050}
 for(let it of items)if(!it.hit)it.y+=it.speed*dt;
 for(let it of items)hit(it);
 items=items.filter(it=>!it.hit&&it.y<innerHeight+100);

 for(let it of items){
  let im=images[it.file];
  if(im.complete)ctx.drawImage(im,it.x-44,it.y-44,88,88);
  else{ctx.font="58px sans-serif";ctx.textAlign="center";ctx.fillText(it.emoji,it.x,it.y)}
 }

 let sx=innerWidth/2+shieldX,sy=innerHeight-155;
 ctx.beginPath();ctx.arc(sx,sy,48,0,Math.PI*2);
 ctx.lineWidth=9;ctx.strokeStyle="#00d9ff";ctx.stroke();
 ctx.beginPath();ctx.arc(sx,sy,29,0,Math.PI*2);
 ctx.fillStyle="rgba(255,255,255,.8)";ctx.fill();
 requestAnimationFrame(draw)
}
requestAnimationFrame(draw);
</script>
</body></html>
